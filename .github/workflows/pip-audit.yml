name: Dependency audit (pip-audit)

on:
  pull_request:
    paths:
      - 'worker/requirements-cad.txt'
  push:
    branches:
      - main
    paths:
      - 'worker/requirements-cad.txt'

jobs:
  pip-audit:
    name: pip-audit — worker/requirements-cad.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        # Accepted, documented transitive findings (SecurityEngineer review, PLA-1133, 2026-06-15).
        # vtk 9.3.1 (resolved transitively via cadquery 2.7.0 / cadquery-ocp 7.8.1.1.post1)
        # carries 3 CVEs, ALL confined to vtkGLTFDocumentLoader (the GLTF/.glb import path):
        #   PYSEC-2025-224  CVSS 7.5  buffer overflow in BufferDataExtractionWorker
        #   PYSEC-2025-225  CVSS 7.1  heap buffer overflow in Accessor copy ctor
        #   PYSEC-2025-226  CVSS 9.8  heap use-after-free during mesh copy
        # Fixed upstream in vtk 9.5.1.
        # NOT REACHABLE in this deployment: the cad worker only *generates* geometry from
        # build scripts and *exports* via cq.exporters (STEP/STL/3MF). It never imports or
        # parses GLTF, so vtkGLTFDocumentLoader is never invoked. The worker additionally
        # runs in a bwrap+seccomp sandbox with no network and a mount allowlist.
        # Pre-existing transitive (identical findings on origin/main baseline; not introduced
        # by this PR). vtk cannot be pinned independently because cadquery-ocp 7.8.1.1.post1
        # is ABI-bound to its vtk build; a real fix requires a cadquery/ocp stack bump.
        # Re-pin to vtk>=9.5.1 tracked in PLA-1135; revisit IMMEDIATELY if the worker ever
        # gains a mesh/GLTF import path. --ignore-vuln only suppresses these named IDs, so the
        # gate still fails on any new or different vulnerability.
        run: >-
          pip-audit -r worker/requirements-cad.txt
          --ignore-vuln PYSEC-2025-224
          --ignore-vuln PYSEC-2025-225
          --ignore-vuln PYSEC-2025-226
